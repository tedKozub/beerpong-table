name: CI Pipeline & Verification

on:
  push:
    branches: [ staging, main, feature/* ]
  pull_request:
    branches: [ staging, main ]

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Security Audit
        run: npm run check:security
      - name: Lint and Code Style
        run: npm run lint
      - name: TypeScript Type Check
        run: npm run check:types
      - name: Next.js Production Build
        run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run E2E Tests
        run: npx playwright test
        env:
          PLAYWRIGHT_TEST_BASE_URL: https://staging.beerpong.tadeaskozub.com
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD || 'SppdfBeerpongAdmin2026!' }}
        continue-on-error: true
